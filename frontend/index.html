<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/reset.css">
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/index.css">
    <link rel="stylesheet" href="styles/components.css">
    <title>Gym Flow - Home</title>
</head>

<body id="home-page">
    <header>
        <nav class="navigation-bar">

            <div class="container-nav-title">
                <svg xmlns="http://www.w3.org/2000/svg" height="36px" viewBox="0 -960 960 960" width="36px"
                    fill="#e3e3e3">
                    <path
                        d="m826-585-56-56 30-31-128-128-31 30-57-57 30-31q23-23 57-22.5t57 23.5l129 129q23 23 23 56.5T857-615l-31 30ZM346-104q-23 23-56.5 23T233-104L104-233q-23-23-23-56.5t23-56.5l30-30 57 57-31 30 129 129 30-31 57 57-30 30Zm397-336 57-57-303-303-57 57 303 303ZM463-160l57-58-302-302-58 57 303 303Zm-6-234 110-109-64-64-109 110 63 63Zm63 290q-23 23-57 23t-57-23L104-406q-23-23-23-57t23-57l57-57q23-23 56.5-23t56.5 23l63 63 110-110-63-62q-23-23-23-57t23-57l57-57q23-23 56.5-23t56.5 23l303 303q23 23 23 56.5T857-441l-57 57q-23 23-57 23t-57-23l-62-63-110 110 63 63q23 23 23 56.5T577-161l-57 57Z" />
                </svg>
                <h2 class="nav-title">Gym Flow</h2>
            </div>
        </nav>
    </header>
    <main>
        <div class="card">
            <h2>Fichas Disponíveis</h2>
            <ul class="list-container" id="workout-list"></ul>
            <button class="btn-primary" id="btn-open-workout-modal">Criar nova ficha</button>
        </div>

        <div class="card">
            <h2>Exercícios disponíveis</h2>
            <ul class="list-container" id="exercise-list"></ul>
            <button class="btn-primary" id="btn-open-exercise-modal">Criar novo exercício</button>
        </div>
    </main>

    <!-- Modal para criar nova ficha (Workout)-->
    <dialog id="workout-modal" class="modal">
        <div class="modal-header">
            <h2>Nova Ficha</h2>
            <button class="btn-close" id="modal-close-workout-btn">✕</button>
        </div>
        <input type="text" placeholder="Digite o nome..." class="modal-input" id="workout-modal-input">
        <button class="btn-primary" id="workout-save-btn">Criar</button>
    </dialog>

    <!-- Modal para criar novo exercício (Exercise)-->
    <dialog id="exercise-modal" class="modal">
        <div class="modal-header">
            <h2>Novo Exercício</h2>
            <button class="btn-close" id="modal-close-exercise-btn">✕</button>
        </div>
        <input type="text" placeholder="Digite o nome..." class="modal-input" id="exercise-modal-input">
        <label for="muscle-group">Selecione o grupo muscular:</label>
        <select name="muscle-group" id="exercise-modal-select" class="exercise-select">
            <option>Selecionar...</option>
            <option value="CHEST">Peito</option>
            <option value="BACK">Costas</option>
            <option value="SHOULDERS">Ombro</option>
            <option value="ARMS">Braço</option>
            <option value="CORE">Core</option>
            <option value="LEGS">Pernas</option>
        </select>
        <button class="btn-primary" id="exercise-save-btn">Criar</button>
    </dialog>

    <script defer type="module" src="js/pages/index.js"></script>
</body>

</html>
